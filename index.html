/* ---- estimate display ---- */
let motionTimer = 0;
function paintMotion(){
  clearTimeout(motionTimer);
  motionTimer = setTimeout(() => {
    if (!statMotion) return;
    const m = measureMotion();
    statMotion.textContent = (m * 100).toFixed(m < 0.1 ? 1 : 0) + '%' + (m < STILL ? ', looks still' : m < 0.06 ? ', subtle' : '');
    statMotion.style.color = m < STILL ? 'var(--bad)' : m < 0.06 ? 'var(--warn)' : '';
  }, 250);
}
function paintSize(){
  paintMotion();
  const target = X.targetKB * 1024;
  statPx.textContent = X.w + ' x ' + X.h;
  statFrames.textContent = frameCount(X) + ' @ ' + (+realFps(X).toFixed(2)) + ' fps';
  statCol.textContent = X.maxColors + (X.dither === 'none' ? '' : ', ' + (X.dither === 'fs' ? 'F-S' : 'ordered'));
  if (fileBytes == null || sizeStale){
    const rough = roughBytes(X);
    const r = rough / target;
    sizeEl.className = 'size ' + (r <= 1 ? 'good' : r <= 1.35 ? 'warn' : 'bad');
    sizeEl.textContent = '~' + fmtBytes(rough);
    sizeEl.title = 'Rough figure. Press Measure exact for the real byte count.';
    barEl.style.width = clamp(r * 100, 2, 100) + '%';
    return;
  }
  sizeEl.title = 'Exact byte count from a real encode.';
  sizeEl.textContent = fmtBytes(fileBytes);
  const ratio = fileBytes / target;
  sizeEl.className = 'size ' + (ratio <= 1 ? 'good' : ratio <= 1.35 ? 'warn' : 'bad');
  barEl.style.width = clamp(ratio * 100, 2, 100) + '%';
}

function showOverlay(title){
  $('#ovTitle').textContent = title;
  $('#ovBar').style.width = '0%';
  $('#ovLbl').textContent = 'Starting';
  $('#overlay').classList.add('show');
  token = { cancel: false };
}
function prog(p, label){
  $('#ovBar').style.width = clamp(p * 100, 0, 100) + '%';
  if (label) $('#ovLbl').textContent = label;
}
function hideOverlay(){ $('#overlay').classList.remove('show'); }
function askOverlay(title, msg, buttons){
  return new Promise(res => {
    const ov = $('#overlay'), bar = $('#ovBar').parentElement, cancel = $('#ovCancel');
    $('#ovTitle').textContent = title;
    $('#ovLbl').textContent = msg;
    bar.style.display = 'none'; cancel.style.display = 'none';
    const row = document.createElement('div'); row.className = 'btnrow';
    buttons.forEach(([label, val], i) => {
      const b = document.createElement('button');
      b.className = 'btn sm' + (i === 0 ? ' primary' : '');
      b.textContent = label;
      b.onclick = () => { row.remove(); bar.style.display = ''; cancel.style.display = ''; ov.classList.remove('show'); res(val); };
      row.appendChild(b);
    });
    $('.ovbox').appendChild(row);
    ov.classList.add('show');
  });
}
$('#ovCancel').onclick = () => { token.cancel = true; hideOverlay(); toast('Cancelled'); };

async function guarded(fn){
  try { return await fn(); }
  catch(e){ hideOverlay(); console.error(e); toast('Export failed: ' + (e && e.message || e)); return null; }
}
async function doMeasure(){ return guarded(doMeasureInner); }
async function doMeasureInner(){
  showOverlay('Measuring exact size');
  const r = await measureGIF(Object.assign({}, X), snapshotParams(), prog, token);
  hideOverlay();
  if (!r) return;
  fileBytes = r.length; sizeStale = false; paintSize();
  toast('Exactly ' + fmtBytes(r.length) + '. Export is instant now.');
}

async function doFit(){ return guarded(doFitInner); }
async function doFitInner(){
  showOverlay('Fitting to ' + X.targetKB + ' KB');
  const res = await fitToTarget(Object.assign({}, X), snapshotParams(), X.targetKB * 1024, prog, token);
  hideOverlay();
  if (!res) return;
  Object.assign(X, res.cfg);
  fileBytes = res.bytes.length; sizeStale = false;
  sizePreview(); refresh(); paintSize(); save();
  if (fileBytes <= X.targetKB * 1024) toast('Fitted to ' + fmtBytes(fileBytes) + ' at ' + X.w + 'x' + X.h + ', ' + X.maxColors + ' colours. Export is instant now.');
  else toast('Closest reachable is ' + fmtBytes(fileBytes) + '. Shorten the loop or turn off animated grain.');
}

async function doExportGIF(skipGuard){ return guarded(() => doExportGIFInner(skipGuard)); }
/* Share of the picture that changes across the loop, from four small renders.
   Grain is switched off for the test, since animated grain would read as motion. */
function measureMotion(){
  const W = 120, H = Math.max(24, Math.round(120 * X.h / X.w));
  const b = buf('motion', W, H, true), c = cropOf(X), n = frameCount(X);
  const p = Object.assign({}, P, { grain: 0 });
  renderOut(b.x, W, H, 0, p, 0, c);
  const a = new Uint8ClampedArray(b.x.getImageData(0, 0, W, H).data);
  let most = 0;
  for (const t of [0.25, 0.5, 0.75]){
    renderOut(b.x, W, H, t, p, Math.round(t * n), c);
    const d = b.x.getImageData(0, 0, W, H).data;
    let k = 0;
    for (let i = 0; i < d.length; i += 4) if (Math.abs(d[i] - a[i]) + Math.abs(d[i + 1] - a[i + 1]) + Math.abs(d[i + 2] - a[i + 2]) > 24) k++;
    most = Math.max(most, k / (W * H));
  }
  return most;
}
const STILL = 0.015;

async function doExportGIFInner(skipGuard){
  const motion = measureMotion();
  if (!skipGuard && motion < STILL){
    const pick = await askOverlay('This loop barely moves',
      'Only ' + (motion * 100).toFixed(1) + '% of the picture changes over the loop, so the GIF will look like a still image. Raise Travel, Warp or Motion speed, or try another style.',
      [['Cancel', 'cancel'], ['Export anyway', 'go']]);
    if (pick !== 'go') return;
  }
  showOverlay('Encoding GIF');
  const t0 = performance.now();
  const bytes = await measureGIF(Object.assign({}, X), snapshotParams(), prog, token);
  hideOverlay();
  if (!bytes) return;
  fileBytes = bytes.length; sizeStale = false; paintSize();
  const target = X.targetKB * 1024;
  if (!skipGuard && bytes.length > target * 1.15){
    const pick = await askOverlay(
      fmtBytes(bytes.length) + ', over your ' + fmtBytes(target) + ' target',
      'Fewer frames, fewer colours or a smaller canvas will bring it down.',
      [['Fit to target', 'fit'], ['Save anyway', 'save'], ['Cancel', 'cancel']]);
    if (pick === 'cancel') return;
    if (pick === 'fit'){ await doFit(); return doExportGIF(true); }
  }
  download(new Blob([bytes], { type: 'image/gif' }), fileName('gif'));
  toast('GIF saved, ' + fmtBytes(bytes.length) + ' in ' + ((performance.now() - t0) / 1000).toFixed(1) + 's');
}

async function doExportWEBM(){
  if (typeof MediaRecorder === 'undefined'){ toast('This browser cannot record WebM'); return; }
  showOverlay('Recording WebM');
  try { await exportWEBM(prog, token); } catch(e){ toast('WebM failed: ' + e.message); }
  hideOverlay();
}

/* ---- preview ---- */
function sizePreview(){
  const wrap = $('.canvaswrap');
  const availW = Math.max(80, wrap.clientWidth - 48);
  const availH = Math.max(80, wrap.clientHeight - 48);
  const ar = X.w / X.h;
  let cw = availW, ch = cw / ar;
  if (ch > availH){ ch = availH; cw = ch * ar; }
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  PW = clamp(Math.round(cw * dpr), 48, 1000);
  PH = Math.max(24, Math.round(PW / ar));
  cv.width = PW; cv.height = PH;
}

/* GIF view: renders at export size, runs it through the same palette and
   dither as the export, and shows those pixels, so grain, banding and colour
   loss are visible before a file is ever made. Frame delta is not simulated;
   at tolerances under 8 it changes nothing visible. */
let gifView = false;
const GV = { key: '', pending: '', q: null, idx: null, building: false, timer: 0 };
let ENCODING = 0;
function ensureGifPalette(){
  const key = cfgKey(X, P);
  if (GV.key === key || GV.building || ENCODING) return;
  /* This runs every animation frame. Restarting the timer each time meant it
     never fired, so only reschedule when the settings actually changed. While a
     slider is being dragged the key keeps changing, which is the debounce. */
  if (GV.pending === key) return;
  clearTimeout(GV.timer);
  GV.pending = key;
  GV.timer = setTimeout(async () => {
    GV.pending = '';
    if (ENCODING) return;
    GV.building = true;
    try {
      const reserve = X.deltaOn ? 1 : 0;
      const pal = await buildPalette(Object.assign({}, X), snapshotParams(), Math.min(256 - reserve, X.maxColors));
      GV.q = new Quant(pal); GV.key = key;
    } catch(e){ console.error(e); }
    finally { GV.building = false; }
  }, 180);
}
function drawGifView(t, fi){
  ensureGifPalette();
  if (!GV.q || ENCODING){ renderOut(pctx, PW, PH, t, P, fi, cropOf(X)); return; }
  const b = buf('gv', X.w, X.h, true);
  renderOut(b.x, X.w, X.h, t, P, fi, cropOf(X));
  const img = b.x.getImageData(0, 0, X.w, X.h), d = img.data;
  if (!GV.idx || GV.idx.length !== X.w * X.h) GV.idx = new Uint8Array(X.w * X.h);
  quantize(d, GV.idx, X.w, X.h, GV.q, X.dither, X.ditherAmt);
  const q = GV.q, idx = GV.idx;
  for (let i = 0, o = 0; i < idx.length; i++, o += 4){ const k = idx[i]; d[o] = q.R[k]; d[o + 1] = q.G[k]; d[o + 2] = q.B[k]; d[o + 3] = 255; }
  b.x.putImageData(img, 0, 0);
  pctx.setTransform(1, 0, 0, 1, 0, 0);
  pctx.globalAlpha = 1; pctx.globalCompositeOperation = 'source-over';
  pctx.imageSmoothingEnabled = true; pctx.imageSmoothingQuality = 'high';
  pctx.clearRect(0, 0, PW, PH);
  pctx.drawImage(b.c, 0, 0, PW, PH);
}
$('#gifViewBtn').onclick = () => {
  gifView = !gifView;
  $('#gifViewBtn').classList.toggle('primary', gifView);
  if (gifView) toast('GIF view: showing the exact colours and dither of the export');
};

function tick(now){
  const dt = lastT ? now - lastT : 16;
  lastT = now;
  if (playing) previewT = (previewT + dt / (X.dur * 1000)) % 1;
  const n = frameCount(X);
  const fi = clamp(Math.floor(previewT * n), 0, n - 1);
  if (gifView) drawGifView(fi / n, fi);
  else renderOut(pctx, PW, PH, fi / n, P, fi, cropOf(X));
  $('#tmeta').textContent = 'frame ' + (fi + 1) + ' / ' + n;
  const sc = $('#scrub');
  if (document.activeElement !== sc) sc.value = Math.round(previewT * 100);
  requestAnimationFrame(tick);
}

/* drag the preview to move the crop window */
(() => {
  let dragging = false, lx = 0, ly = 0;
  const canPan = () => { const z = cropZoom(X); return z.zx > 1.001 || z.zy > 1.001; };
  const setCursor = () => { cv.style.cursor = canPan() ? (dragging ? 'grabbing' : 'grab') : 'default'; };
  REFRESH.push(setCursor);
  cv.addEventListener('pointerdown', e => {
    if (!canPan()) return;
    dragging = true; lx = e.clientX; ly = e.clientY;
    cv.setPointerCapture(e.pointerId); setCursor(); e.preventDefault();
  });
  cv.addEventListener('pointermove', e => {
    if (!dragging) return;
    const r = cv.getBoundingClientRect();
    const z = cropZoom(X);
    /* one screen width of drag should move a full screen width of composition,
       which is r.width * (zoom - 1) of travel in crop terms */
    const spanX = r.width * (z.zx - 1), spanY = r.height * (z.zy - 1);
    if (spanX > 0) X.panX = clamp(X.panX - (e.clientX - lx) / spanX, 0, 1);
    if (spanY > 0) X.panY = clamp(X.panY - (e.clientY - ly) / spanY, 0, 1);
    lx = e.clientX; ly = e.clientY;
    markStale(); refresh();
  });
  const end = e => {
    if (!dragging) return;
    dragging = false;
    try { cv.releasePointerCapture(e.pointerId); } catch(err){}
    setCursor(); save();
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  setCursor();
})();

$('#playBtn').onclick = () => togglePlay();
function togglePlay(){
  playing = !playing;
  $('#playIcon').innerHTML = playing ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M8 5l12 7-12 7z"/>';
}
$('#scrub').addEventListener('input', e => {
  if (playing) togglePlay();
  previewT = (+e.target.value) / 100;
});

function randomiseAll(){
  const names = Object.keys(PALETTES);
  const pn = names[Math.floor(Math.random() * names.length)];
  P.colors = PALETTES[pn].slice();
  P.bg = P.colors[Math.random() < 0.7 ? 0 : 4];
  P.style = STYLES[Math.floor(Math.random() * STYLES.length)][0];
  P.mix = ['screen','source-over','lighter','overlay'][Math.floor(Math.random() * 4)];
  P.seed = 1 + Math.floor(Math.random() * 99999);
  P.blobs = 3 + Math.floor(Math.random() * 6);
  P.bands = 3 + Math.floor(Math.random() * 7);
  P.angle = Math.floor(Math.random() * 360);
  P.blobSize = 0.35 + Math.random() * 0.7;
  P.spread = 0.3 + Math.random() * 0.8;
  P.warp = Math.random() * 0.7;
  P.softness = 0.4 + Math.random() * 0.4;
  P.blur = 8 + Math.random() * 34;
  P.saturation = 0.8 + Math.random() * 0.7;
  P.vignette = Math.random() * 0.45;
  P.posterize = Math.random() < 0.22 ? 3 + Math.floor(Math.random() * 6) : 0;
  P.grain = Math.random() * 0.22;
  const roll = Math.random();
  P.fx = roll < 0.55 ? 'none' : roll < 0.7 ? 'halftone' : roll < 0.82 ? 'dotglass' : roll < 0.92 ? 'fluted' : 'panes';
  if (P.fx === 'halftone'){
    P.htCell = 8 + Math.random() * 26; P.htAspect = 0.35 + Math.random() * 1.2;
    P.htMax = 0.9 + Math.random() * 0.5; P.htMin = Math.random() < 0.5 ? 0 : Math.random() * 0.2; P.htAngle = Math.random() < 0.6 ? 0 : Math.floor(Math.random() * 90);
    P.htMode = Math.random() < 0.5 ? 'ink' : 'source';
    P.htInk = P.colors[4]; P.htPaper = P.colors[0]; P.htInvert = P.htMode === 'source';
  } else if (P.fx === 'dotglass'){
    P.dgCell = 30 + Math.random() * 90; P.dgDepth = 0.25 + Math.random() * 0.5;
    P.dgLight = Math.floor(Math.random() * 360); P.dgOverlap = -0.05 + Math.random() * 0.2;
  } else if (P.fx === 'fluted'){
    P.flCount = 8 + Math.floor(Math.random() * 40); P.flRefract = 1.3 + Math.random() * 2;
    P.flAngle = Math.random() < 0.7 ? 0 : Math.floor(Math.random() * 180); P.flEdge = Math.random() * 0.6;
    P.flCover = Math.random() < 0.5 ? 1 : 0.35 + Math.random() * 0.5;
  } else if (P.fx === 'panes'){
    P.pnCount = 3 + Math.floor(Math.random() * 8);
    P.pnShape = ['rrect','circle','arc'][Math.floor(Math.random() * 3)];
    P.pnScale = 0.2 + Math.random() * 0.6; P.pnOffX = -0.2 + Math.random() * 0.4;
    P.pnOffY = -0.2 + Math.random() * 0.4; P.pnAlpha = 0.25 + Math.random() * 0.5;
    P.pnGlow = Math.random(); P.pnRot = -30 + Math.random() * 60;
  }
  invalidate(); refresh();
}

document.addEventListener('keydown', e => {
  if (/input|select|textarea/i.test(e.target.tagName)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R'){
    if (e.shiftKey) randomiseAll();
    else { P.seed = 1 + Math.floor(Math.random() * 99999); invalidate(); refresh(); }
  }
  else if (e.key === 'e' || e.key === 'E'){ if (localEngineName()) doExportLocal(); else doExportGIF(); }
});

/* ---- persistence ---- */
let saveTimer = 0;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem('ggs.v2', JSON.stringify({ P, X })); } catch(e){}
  }, 400);
}
function load(){
  try {
    const raw = localStorage.getItem('ggs.v2');
    if (raw){
      const o = JSON.parse(raw);
      if (o.P) Object.assign(P, o.P);
      if (o.X) Object.assign(X, o.X);
    }
  } catch(e){}
  /* Before v3 the defaults were a 48 colour grid dither at tolerance 18, which is
     what printed the crosshatch and the smearing. Upgrade those values only where
     they still equal the old defaults, so deliberate choices survive. */
  if (!(X.v >= 3)){
    if (X.deltaThresh === 18 || X.deltaThresh === 12) X.deltaThresh = 4;
    if (X.dither === 'ordered' && (X.maxColors === 48 || X.maxColors === 64)) X.dither = 'blue';
    if (typeof X.ditherAmt !== 'number') X.ditherAmt = 0.6;
    X.v = 3;
  }
  /* crop used to be a single uniform zoom */
  if (typeof X.zoomX !== 'number') X.zoomX = typeof X.zoom === 'number' ? X.zoom : 1;
  if (typeof X.zoomY !== 'number') X.zoomY = typeof X.zoom === 'number' ? X.zoom : 1;
  if (typeof X.linkZoom !== 'boolean') X.linkZoom = Math.abs(X.zoomX - X.zoomY) < 0.001;
  delete X.zoom;
}

/* ---- boot ---- */
load();
let rsz;
window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(sizePreview, 120); });
sizePreview();
refresh();
paintSize();
requestAnimationFrame(tick);

$('#ver').textContent = 'v' + APP_VERSION;
detectLocal().then(e => { LOCAL = e; refresh(); });
(async () => {
  if (location.protocol === 'file:') return;
  try {
    /* cache: 'reload' on the bare address both reads the current file and
       replaces any stale copy the browser was holding for it, so opening this
       version once also repairs the plain URL for next time. Verified in
       Chromium: the plain URL went from a 0 byte cached copy to the live file. */
    const r = await fetch(location.pathname, { cache: 'reload' });
    const m = (await r.text()).match(new RegExp('const APP_' + 'VERSION = \'([^\']+)\''));
    if (m && m[1] !== APP_VERSION){
      const bar = document.createElement('div'); bar.className = 'update-bar';
      bar.innerHTML = '<span>A newer version of the studio is available (v' + m[1] + '). You are running v' + APP_VERSION + '.</span>';
      const go = document.createElement('button'); go.className = 'btn sm primary'; go.textContent = 'Load it';
      go.onclick = () => location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
      bar.appendChild(go); document.body.appendChild(bar);
    }
  } catch(e){}
})();
</script>
</body>
